name: Deploy to VPS

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/newsseo
            export GHCR_OWNER="$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")"
            export IMAGE_TAG="latest"
            export CR_PAT="${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}"
            export CR_USER="${{ secrets.GHCR_USER || github.actor }}"

            echo "$CR_PAT" | docker login ghcr.io -u "$CR_USER" --password-stdin
            docker compose pull
            docker compose up -d
            docker logout ghcr.io

            PORT="${PORT:-3001}"
            curl -fsS "http://localhost:${PORT}/health"
