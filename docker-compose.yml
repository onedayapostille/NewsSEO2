services:
  app:
    image: ghcr.io/${GHCR_OWNER:-changeme}/newsseo:${IMAGE_TAG:-latest}
    container_name: newsseo-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3001}
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-3001}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
